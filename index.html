---
layout: null
---
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernseiten von Herrn Wolf</title>
  <style>
    body {
      max-width: 46rem;
      margin: 2rem auto;
      padding: 0 1rem;
      font: 18px/1.5 system-ui, sans-serif;
      color: #173554;
    }
    details { margin: .5rem 0; }
    summary {
      padding: .7rem 1rem;
      background: #eaf2fb;
      border-radius: .5rem;
      cursor: pointer;
      font-weight: bold;
    }
    .inhalt {
      margin-left: 1rem;
      padding-left: .8rem;
      border-left: 2px solid #d7e3ef;
    }
    a { display: block; padding: .65rem; color: #124b83; }
  </style>
</head>
<body>
  <h1>Lernseiten von Herrn Wolf</h1>
  <p>Wähle deinen Ordner und tippe auf eine Übung.</p>
  <nav id="ordnerbaum" aria-label="Lernseiten"></nav>

  <script>
    const dateien = [
      {% assign sortiert = site.static_files | sort: "path" %}
      {% for datei in sortiert %}
        {% assign endung = datei.extname | downcase %}
        {% if endung == ".html" or endung == ".htm" %}
          {{ datei.path | jsonify }},
        {% endif %}
      {% endfor %}
    ];

    const start = document.getElementById("ordnerbaum");
    const ordner = new Map([["", start]]);

    for (const pfad of dateien) {
      const teile = pfad.split("/").filter(Boolean);
      const dateiname = teile.pop();
      let ebene = start;
      let schluessel = "";

      for (const name of teile) {
        schluessel += "/" + name;

        if (!ordner.has(schluessel)) {
          const fach = document.createElement("details");
          const titel = document.createElement("summary");
          const inhalt = document.createElement("div");

          titel.textContent = name;
          inhalt.className = "inhalt";
          fach.append(titel, inhalt);
          ebene.append(fach);
          ordner.set(schluessel, inhalt);
        }

        ebene = ordner.get(schluessel);
      }

      const link = document.createElement("a");
      link.href = "./" + [...teile, dateiname].map(encodeURIComponent).join("/");
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = dateiname
        .replace(/\.html?$/i, "")
        .replace(/[_-]+/g, " ");
      ebene.append(link);
    }

    if (dateien.length === 0) {
      start.textContent = "Es sind noch keine HTML-Übungen hochgeladen.";
    }
  </script>
</body>
</html>
